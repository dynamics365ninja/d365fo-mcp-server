name: config-docs

# docs/CONFIGURATION.md is generated from src/config/settings.ts. It was once
# hand-edited to add three environment variables the registry did not know
# about, which meant the next `npm run config:docs` would have deleted them
# without anyone noticing. This gate makes that impossible: the committed file
# must equal what the registry renders.
#
# Deliberately its own workflow rather than a step in eval-gate: it needs no
# build, no C# bridge and no test run, so it can fail in seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config-docs-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: docs/CONFIGURATION.md matches the setting registry
        run: npm run config:docs -- --check
