name: eval-gate

# Regression gate for the agent eval loop (docs/AGENT_EVAL_LOOP.md Phase 3) plus
# the full unit suite. VM-free: builds the server, runs every test (including the
# golden-integrity gate tests/eval/goldens.test.ts and the oracle/improver units),
# so a malformed golden commit or a normalizer regression fails here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'

jobs:
  # The one thing this workflow CANNOT do is compile the C# bridge: it references
  # Microsoft.Dynamics.AX.Metadata assemblies that exist only on a D365FO development
  # machine, the repo is public so they cannot be vendored, and there is no self-hosted
  # runner. Worth stating out loud, because the repo's CodeQL setup contributes a green
  # `Analyze (csharp)` check that runs build-mode:none and compiles nothing — it is easy
  # to read that as C# coverage.
  #
  # So the gate is an attestation instead: `npm run bridge:build` writes a hash of the
  # sources it compiled, and this job fails when bridge/ moved without it. Cheap, and it
  # runs unconditionally — no path filter to get wrong.
  bridge-attestation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bridge sources match their attested build
        run: node scripts/bridgeAttest.mjs check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check / build
        run: npm run build

      # `npm test` is vitest in watch mode — use the one-shot runner for CI.
      - name: Unit tests + golden regression gate
        run: npx vitest run

      # Knowledge content is gated the same fail-closed way generated code is:
      # every named AOT type/API in KNOWLEDGE_BASE must be covered by a
      # snapshot captured against the real symbol index on the VM.
      - name: Knowledge audit (snapshot verify)
        run: npm run eval:knowledge-audit

      # Published reliability metric: a new AOT type or topic without K∧E∧T
      # visibly drops the number, and stale artifacts fail the build (P4).
      - name: Coverage matrix up to date
        run: npm run eval:coverage -- --check

      - name: Eval scoreboard (informational)
        if: always()
        run: npm run eval:report || true
